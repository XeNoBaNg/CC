<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Registration</title>
    <style>
        :root { --accent: #6c5ce7; --bg: #f9f9fb; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2d3436; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .guest-list { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .guest-item { background: #fff; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏆 Event Registration</h2>
    <form id="regForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <select id="event">
            <option value="Tech Workshop">Tech Workshop</option>
            <option value="Coding Hackathon">Coding Hackathon</option>
            <option value="AI Seminar">AI Seminar</option>
        </select>
        <button type="submit">Register Now</button>
    </form>

    <div class="guest-list">
        <h3>Confirmed Participants</h3>
        <div id="participants"></div>
    </div>
</div>

<script>
    const API = "http://YOUR_NEW_EC2_IP:5000/api";

    async function loadParticipants() {
        const res = await fetch(`${API}/participants`);
        const data = await res.json();
        document.getElementById('participants').innerHTML = data.map(p => `
            <div class="guest-item">
                <strong>${p.name}</strong> signed up for <em>${p.event}</em>
            </div>
        `).join('');
    }

    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            event: document.getElementById('event').value
        };

        await fetch(`${API}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        alert("Registered Successfully!");
        document.getElementById('regForm').reset();
        loadParticipants();
    };

    loadParticipants();
</script>
</body>
</html>
