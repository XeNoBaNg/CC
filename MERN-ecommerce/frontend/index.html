<!DOCTYPE html>
<html>
<head><title>MERN Store</title></head>
<body>
    <h1>MERN E-Commerce</h1>
    <div id="root"></div>
    <script>
        const API = "http://YOUR_EC2_PUBLIC_IP:5000/api";
        
        async function load() {
            const res = await fetch(`${API}/products`);
            const items = await res.json();
            document.getElementById('root').innerHTML = items.map(i => `
                <div>${i.name} - $${i.price} <button onclick="buy('${i.name}')">Buy</button></div>
            `).join('');
        }
        
        async function buy(name) {
            const res = await fetch(`${API}/purchase`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            alert(data.message);
        }
        
        load();
    </script>
</body>
</html>
