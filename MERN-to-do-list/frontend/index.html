<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pro Task Manager</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f0f2f5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .app-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #fff;
            border: 1px solid #eee;
            margin-bottom: 12px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .task-item.done {
            background: #f8fef9;
            border-color: #d4edda;
            opacity: 0.7;
        }

        .task-item.done span {
            text-decoration: line-through;
            color: #888;
        }

        .btns {
            display: flex;
            gap: 8px;
        }

        .check-btn {
            background: #e8f5e9;
            color: var(--success);
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .del-btn {
            background: #fdeaea;
            color: var(--danger);
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="app-card">
        <h2>Task Manager</h2>
        <div class="input-box">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>
        <div id="taskList"></div>
    </div>

    <script>
        const API = "http://65.2.161.75:5000/api/tasks"; // Ensure this matches your VM IP

        async function getTasks() {
            const res = await fetch(API);
            const data = await res.json();
            document.getElementById('taskList').innerHTML = data.map(t => `
            <div class="task-item ${t.completed ? 'done' : ''}">
                <span>${t.title}</span>
                <div class="btns">
                    <button class="check-btn" onclick="toggle('${t._id}')">${t.completed ? '↩️' : '✅'}</button>
                    <button class="del-btn" onclick="del('${t._id}')">🗑️</button>
                </div>
            </div>
        `).join('');
        }

        async function addTask() {
            const title = document.getElementById('taskInput').value;
            if (!title) return;
            await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });
            document.getElementById('taskInput').value = '';
            getTasks();
        }

        async function toggle(id) {
            await fetch(`${API}/${id}/toggle`, { method: 'PUT' });
            getTasks();
        }

        async function del(id) {
            await fetch(`${API}/${id}`, { method: 'DELETE' });
            getTasks();
        }

        getTasks();
    </script>
</body>

</html>
