<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System</title>
    <style>
        :root {
            --primary: #3498db;
            --danger: #e74c3c;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 25px 0;
        }

        .student-card {
            border: 1px solid #eee;
            background: #fafafa;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .student-card p {
            margin: 0;
            color: #444;
        }

        .student-card strong {
            color: #222;
        }

        .action-btns {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .btn-edit {
            background: #f1c40f;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Record System</h1>

        <div class="form-group">
            <input type="hidden" id="studentId">
            <input type="text" id="name" placeholder="Student Name" required>
            <input type="text" id="rollNo" placeholder="Roll Number" required>
            <input type="text" id="department" placeholder="Department" required>
            <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">Add Student</button>
        </div>

        <hr>

        <div id="studentList">
        </div>
    </div>

    <script>
        const API_URL = "http://YOUR_NEW_EC2_IP:5000/students";

        document.addEventListener("DOMContentLoaded", fetchStudents);

        async function fetchStudents() {
            try {
                const res = await fetch(API_URL);
                const students = await res.json();
                renderStudents(students);
            } catch (error) {
                console.error(error);
            }
        }

        async function handleSubmit() {
            const id = document.getElementById("studentId").value;
            const name = document.getElementById("name").value.trim();
            const rollNo = document.getElementById("rollNo").value.trim();
            const department = document.getElementById("department").value.trim();

            if (!name || !rollNo || !department) {
                alert("Please fill in all fields!");
                return;
            }

            const payload = { name, rollNo, department };

            try {
                if (id) {
                    await fetch(`${API_URL}/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                } else {
                    await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                }

                clearForm();
                fetchStudents();
            } catch (error) {
                console.error(error);
            }
        }

        function editStudent(id, name, rollNo, department) {
            document.getElementById("studentId").value = id;
            document.getElementById("name").value = name;
            document.getElementById("rollNo").value = rollNo;
            document.getElementById("department").value = department;

            const btn = document.getElementById("submitBtn");
            btn.innerText = "Update Student";
            btn.style.backgroundColor = "#f39c12";
        }

        async function deleteStudent(id) {
            if (confirm("Are you sure you want to delete this student record?")) {
                try {
                    await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                    fetchStudents();
                } catch (error) {
                    console.error(error);
                }
            }
        }

        function clearForm() {
            document.getElementById("studentId").value = "";
            document.getElementById("name").value = "";
            document.getElementById("rollNo").value = "";
            document.getElementById("department").value = "";

            const btn = document.getElementById("submitBtn");
            btn.innerText = "Add Student";
            btn.style.backgroundColor = "var(--primary)";
        }

        function renderStudents(students) {
            const listContainer = document.getElementById("studentList");

            if (students.length === 0) {
                listContainer.innerHTML = "<p style='text-align:center; color:#7f8c8d;'>No students found.</p>";
                return;
            }

            listContainer.innerHTML = students.map(student => `
            <div class="student-card">
                <p><strong>Name:</strong> ${student.name}</p>
                <p><strong>Roll No:</strong> ${student.rollNo}</p>
                <p><strong>Department:</strong> ${student.department}</p>
                <div class="action-btns">
                    <button class="btn-edit" onclick="editStudent('${student._id}', '${student.name}', '${student.rollNo}', '${student.department}')">Edit</button>
                    <button class="btn-delete" onclick="deleteStudent('${student._id}')">Delete</button>
                </div>
            </div>
        `).join('');
        }
    </script>

</body>

</html>
